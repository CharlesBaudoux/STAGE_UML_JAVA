# La construction, rejouée à chaque poussée.
#
# Elle existe parce que la qualité du projet ne tenait jusqu'ici qu'à la discipline : 944 tests
# et 96 % de couverture qu'aucune machine ne vérifiait, donc que rien n'empêchait de faire
# baisser sans que personne le voie.
#
# Graphviz est installé explicitement : la bibliothèque le vérifie désormais avant de dessiner et
# refuse de produire une image portant « Cannot find Graphviz ». Sans lui, les tests de rendu
# échoueraient — ce qui est le comportement voulu, mais pas ce qu'on veut voir en intégration.
name: Construction

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bibliotheque:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # « verify » et non « test » : c'est la phase où le seuil de couverture s'applique.
      - name: Construire et vérifier la bibliothèque
        run: mvn --batch-mode --file Bibliotheque_V0/pom.xml verify

      # Le plugin dépend de la bibliothèque : il faut donc que celle-ci soit dans le dépôt local
      # avant de le construire, d'où l'install qui précède.
      - name: Construire le plugin Maven
        run: |
          mvn --batch-mode --file Bibliotheque_V0/pom.xml install -DskipTests
          mvn --batch-mode --file umlg-maven-plugin/pom.xml install

      # La preuve de bout en bout, par les deux chemins que la documentation décrit.
      #
      # Le goal est écrit en entier, et non « umlg:generate » : le préfixe court n'est résolu que
      # si le projet déclare le plugin dans son pom, ou si le groupe figure dans les pluginGroups
      # du settings.xml. Le projet de démonstration, lui, documente la voie exec:java — et c'est
      # justement cette différence qui a fait échouer cette étape la première fois qu'elle a
      # tourné sur un dépôt neuf.
      - name: Engendrer les diagrammes du projet de démonstration, par le plugin
        working-directory: test_collegue
        run: >
          mvn --batch-mode compile
          io.github.oliviercailloux:umlg-maven-plugin:1.0-SNAPSHOT:generate

      # Depuis le répertoire du projet, et non par --file : les arguments passés à exec:java
      # sont des chemins relatifs (« target/classes »), que Maven résout depuis le répertoire
      # d'où il a été lancé et non depuis celui du module. C'est la commande que le README du
      # projet de démonstration donne, et c'est donc celle qu'il faut éprouver.
      - name: Engendrer les diagrammes du projet de démonstration, par exec:java
        working-directory: test_collegue
        run: mvn --batch-mode compile exec:java

      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-jacoco
          path: Bibliotheque_V0/target/site/jacoco/
