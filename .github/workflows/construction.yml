# La construction, rejouée à chaque poussée.
#
# Elle existe parce que la qualité du projet ne tenait jusqu'ici qu'à la discipline : 944 tests
# et 96 % de couverture qu'aucune machine ne vérifiait, donc que rien n'empêchait de faire
# baisser sans que personne le voie.
#
# Graphviz est installé explicitement : la bibliothèque le vérifie désormais avant de dessiner et
# refuse de produire une image portant « Cannot find Graphviz ». Sans lui, les tests de rendu
# échoueraient — ce qui est le comportement voulu, mais pas ce qu'on veut voir en intégration.
name: Construction

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bibliotheque:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # « verify » et non « test » : c'est la phase où le seuil de couverture s'applique.
      - name: Construire et vérifier la bibliothèque
        run: mvn --batch-mode --file UMLGenerator/pom.xml verify

      # Le plugin dépend de la bibliothèque : il faut donc que celle-ci soit dans le dépôt local
      # avant de le construire, d'où l'install qui précède.
      - name: Construire le plugin Maven
        run: |
          mvn --batch-mode --file UMLGenerator/pom.xml install -DskipTests
          mvn --batch-mode --file umlg-maven-plugin/pom.xml install

      # La preuve de bout en bout : un projet tiers sait-il engendrer ses diagrammes ?
      #
      # Elle portait sur test_collegue, un projet de démonstration écrit pour la circonstance, et
      # porte désormais sur Keyboardd, une bibliothèque réelle — une centaine de classes, un
      # fichier de règles qui déclare quatre vues, et des annotations posées pour reproduire les
      # diagrammes de son README. Un cas réel éprouve ce qu'une démonstration ne rencontre pas.
      #
      # Le goal est écrit en préfixe court, et non en coordonnées complètes : « umlg:generate » ne
      # se résout que si le projet déclare le plugin dans son pom, ce que Keyboardd fait. C'est
      # justement cette différence qui avait fait échouer l'étape la première fois qu'elle a
      # tourné sur un dépôt neuf, du temps où le projet de démonstration ne le déclarait pas.
      # L'étape « par exec:java » a disparu avec test_collegue, seul projet à documenter cette
      # voie ; le plugin est celle que la documentation recommande.
      - name: Engendrer les diagrammes de Keyboardd, par le plugin
        working-directory: Keyboardd
        run: mvn --batch-mode compile umlg:generate

      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-jacoco
          path: UMLGenerator/target/site/jacoco/
